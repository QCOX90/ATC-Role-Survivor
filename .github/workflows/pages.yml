name: Build and publish playable prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot editor and export templates
        run: |
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64' -o /tmp/godot.zip
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz&platform=templates' -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and check simulation rules
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --quit
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --script res://tests/operations_test.gd
      - name: Export browser game
        run: |
          mkdir -p build/web
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --export-release Web "build/web/game-${GITHUB_SHA}.html"
          mv "build/web/game-${GITHUB_SHA}.html" build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish browser game
        id: deployment
        uses: actions/deploy-pages@v4

